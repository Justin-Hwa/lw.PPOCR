name: ppocrv6-small-validation

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "include/**"
      - "converter/**"
      - "tools/**"
      - "tests/**"
      - "ci/ppocrv6-small-validation.json"
      - ".github/workflows/ppocrv6-small-validation.yml"
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      assets_url_override:
        description: "Optional validation ZIP URL override"
        required: false
        default: ""
        type: string
      assets_sha256_override:
        description: "Optional validation ZIP SHA-256 override"
        required: false
        default: ""
        type: string
      expected_full_text_sha256_override:
        description: "Optional full OCR text SHA-256 override"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Small validation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-converter.txt
      - name: Install converter dependencies
        run: python -m pip install -r requirements-converter.txt
      - name: Resolve Small validation contract
        id: contract
        shell: bash
        env:
          ASSETS_URL_OVERRIDE: ${{ inputs.assets_url_override }}
          ASSETS_SHA256_OVERRIDE: ${{ inputs.assets_sha256_override }}
          EXPECTED_TEXT_SHA256_OVERRIDE: ${{ inputs.expected_full_text_sha256_override }}
        run: >-
          python tools/resolve_small_validation_contract.py
          --contract ci/ppocrv6-small-validation.json
          --assets-url-override "$ASSETS_URL_OVERRIDE"
          --assets-sha256-override "$ASSETS_SHA256_OVERRIDE"
          --expected-full-text-sha256-override "$EXPECTED_TEXT_SHA256_OVERRIDE"
          --github-output "$GITHUB_OUTPUT"
      - name: Download and verify Small validation archive
        shell: bash
        env:
          ASSETS_URL: ${{ steps.contract.outputs.assets_url }}
          ASSETS_SHA256: ${{ steps.contract.outputs.assets_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p .ci
          curl -L --fail --retry 3 --retry-delay 2 \
            "$ASSETS_URL" -o .ci/ppocrv6-small-validation.zip
          python tools/extract_small_validation_assets.py \
            --archive .ci/ppocrv6-small-validation.zip \
            --sha256 "$ASSETS_SHA256" \
            --output-dir .ci/small-assets
      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: bash
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DBUILD_TESTING=ON
      - name: Configure Linux
        if: runner.os == 'Linux'
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
      - name: Build runtime and standard tests
        run: cmake --build build --config Release --parallel 2
      - name: Run standard contract tests
        run: ctest --test-dir build -C Release --output-on-failure -R "model_analysis|dynamic_reshape_contract"
      - name: Run Small validation pipeline
        run: >-
          python tools/run_small_validation.py
          --assets-dir .ci/small-assets
          --build-dir build
          --output-dir build/small-validation-run
          --rec-max-width "${{ steps.contract.outputs.rec_max_width }}"
          --expected-lines "${{ steps.contract.outputs.expected_lines }}"
          --expected-full-text-sha256 "${{ steps.contract.outputs.expected_full_text_sha256 }}"
      - name: Upload Small validation report
        uses: actions/upload-artifact@v7
        with:
          name: ppocrv6-small-validation-${{ matrix.os }}
          path: build/small-validation-run
          if-no-files-found: error
          retention-days: 14
